version: '3'

tasks:

  # ── Cluster lifecycle ──────────────────────────────────────────────────────

  cycle:
    desc: "ciclo off→on Spark — spegne, attende 20s, riaccende, verifica PVC preservato"
    cmds:
      - echo "→ Spark OFF"
      - kubectl patch whisk controller -n nuvolaris --type=merge -p '{"spec":{"components":{"spark":false}}}'
      - sleep 20
      - echo "→ Spark ON"
      - kubectl patch whisk controller -n nuvolaris --type=merge -p '{"spec":{"components":{"spark":true}}}'
      - sleep 10
      - echo "→ Verifica PVC spark-history-pvc"
      - kubectl -n nuvolaris get pvc spark-history-pvc

  # ── Build & Deploy ─────────────────────────────────────────────────────────

  rebuild-deploy:
    desc: "kaniko-build + patch StatefulSet nuvolaris-operator + ricrea nuvolaris-operator-0"
    cmds:
      - task: :kaniko-build
      # Il vero leader Kopf che gestisce i CRD (Whisk, SparkJob) è nuvolaris-operator-0,
      # pod del StatefulSet nuvolaris-operator. Il bare pod nuvolaris-operator esiste ma
      # cede la leadership all'istanza StatefulSet. Per attivare il nuovo codice buildato
      # bisogna patchare l'immagine dello StatefulSet e ricreare nuvolaris-operator-0.
      - |
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo latest)
        IMG="docker-registry.kube-system.svc.cluster.local:5000/$GITHUB_USER/openserverless-operator:${TAG}"
        echo "→ Patch StatefulSet nuvolaris-operator con immagine: $IMG"
        kubectl -n nuvolaris patch statefulset nuvolaris-operator \
          --type=json \
          -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/image\",\"value\":\"${IMG}\"}]"
      - kubectl -n nuvolaris delete pod nuvolaris-operator-0
      - |
        echo "→ Attendo che lo StatefulSet ricrei nuvolaris-operator-0..."
        until kubectl -n nuvolaris get pod nuvolaris-operator-0 >/dev/null 2>&1; do sleep 2; done
        kubectl -n nuvolaris wait --for=condition=Ready pod/nuvolaris-operator-0 --timeout=180s
      - kubectl -n nuvolaris get pod nuvolaris-operator-0 -o wide
      - kubectl rollout restart deployment/spark-watcher -n nuvolaris
      - kubectl -n nuvolaris rollout status deployment/spark-watcher --timeout=60s

  # Alternativa a rebuild-deploy per ambienti con Docker disponibile localmente:
  # usa docker buildx invece di Kaniko (non richiede Job in-cluster né ConfigMap).
  # Push via NodePort (raggiungibile dal daemon Docker sull'host); patch StatefulSet
  # con DNS interno (usato dai pod nel cluster per il pull — già fidato da containerd).
  rebuild-deploy-buildx:
    desc: "docker buildx build (amd64) + push via NodePort + patch StatefulSet + ricrea nuvolaris-operator-0"
    cmds:
      - |
        PUSH_REGISTRY="docker-registry.kube-system.svc.cluster.local:5000"
        if kubectl -n kube-system get svc docker-registry-nodeport >/dev/null 2>&1; then
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          [ -n "$NODE_IP" ] && PUSH_REGISTRY="${NODE_IP}:30500"
        fi
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
        IMG="${PUSH_REGISTRY}/$GITHUB_USER/openserverless-operator:${TAG}"
        echo "→ Build e push con docker buildx: $IMG"
        docker buildx build \
          --platform linux/amd64 \
          -t "${IMG}" \
          --build-arg OPERATOR_IMAGE_DEFAULT="${PUSH_REGISTRY}/$GITHUB_USER/openserverless-operator" \
          --build-arg OPERATOR_TAG_DEFAULT="${TAG}" \
          . --push
      - |
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
        IMG="docker-registry.kube-system.svc.cluster.local:5000/$GITHUB_USER/openserverless-operator:${TAG}"
        echo "→ Patch StatefulSet nuvolaris-operator con immagine: $IMG"
        kubectl -n nuvolaris patch statefulset nuvolaris-operator \
          --type=json \
          -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/image\",\"value\":\"${IMG}\"}]"
      - kubectl -n nuvolaris delete pod nuvolaris-operator-0
      - |
        echo "→ Attendo che lo StatefulSet ricrei nuvolaris-operator-0..."
        until kubectl -n nuvolaris get pod nuvolaris-operator-0 >/dev/null 2>&1; do sleep 2; done
        kubectl -n nuvolaris wait --for=condition=Ready pod/nuvolaris-operator-0 --timeout=180s
      - kubectl -n nuvolaris get pod nuvolaris-operator-0 -o wide
      - kubectl rollout restart deployment/spark-watcher -n nuvolaris
      - kubectl -n nuvolaris rollout status deployment/spark-watcher --timeout=60s

  standard:
    desc: build (kaniko) e deploy operatore con Spark + istanza whisk-spark
    env:
      GITHUB_USER:
        sh: if [ -n "$GITHUB_USER" ]; then echo "$GITHUB_USER"; else whoami; fi
    cmds:
      - |
        if [ -n "$GHCR_USER" ] && [ -n "$GHCR_TOKEN" ]; then
          echo "Rilevate credenziali GHCR: uso pipeline ghcr (build+push)";
          export GHCR_USER GHCR_TOKEN
          task spark-all-ghcr || { echo "Pipeline GHCR fallita"; exit 1; }
          echo "Deployment GHCR completato, procedo con istanza Spark";
          WHISK=whisk-spark task t:instance;
          exit 0; # Evita esecuzione ramo interno registry
        else
          echo "Credenziali GHCR non presenti: uso percorso registry interno/kind";
        fi
      - |
        if [ "$(./detect.sh)" = "kind" ]; then
          echo "Cluster kind rilevato";
          if command -v kind >/dev/null 2>&1; then
            echo "kind CLI presente: uso build-and-load";
            if ! task build-and-load MY_OPERATOR_IMAGE=docker-registry.kube-system.svc.cluster.local:5000/$GITHUB_USER/openserverless-operator; then
              echo "kind load fallita: fallback a Kaniko";
              task install-registry || exit 1;
              task tag-commit-push || true;
              task kaniko-build-patched || exit 1;
            fi
          else
            echo "kind CLI assente: provo installazione veloce";
            curl -fsSL -o kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64 && chmod +x kind && sudo mv kind /usr/local/bin/kind 2>/dev/null || mv kind "$HOME/.local/bin/kind" 2>/dev/null || true;
            if command -v kind >/dev/null 2>&1; then
              echo "Installazione kind riuscita: eseguo load";
              if ! task build-and-load MY_OPERATOR_IMAGE=docker-registry.kube-system.svc.cluster.local:5000/$GITHUB_USER/openserverless-operator; then
                echo "kind load fallita dopo install: fallback a Kaniko";
                task install-registry || exit 1;
                task tag-commit-push || true;
                task kaniko-build-patched || exit 1;
              fi
            else
              echo "Installazione kind fallita: fallback a Kaniko";
              task install-registry || exit 1;
              task tag-commit-push || true;
              task kaniko-build-patched || exit 1;
            fi
          fi
        else
          echo "Cluster $(./detect.sh): uso Kaniko";
          task install-registry || exit 1;
          task tag-commit-push || true;
          task kaniko-build-patched || exit 1;
        fi
      - kubectl -n nuvolaris apply -f deploy/nuvolaris-permissions || true
      - |
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo latest)
        REGISTRY_HOST="docker-registry.kube-system.svc.cluster.local:5000"
        if [ "$(./detect.sh)" != "kind" ]; then
          if kubectl -n kube-system get svc docker-registry-nodeport >/dev/null 2>&1; then
            NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
            if [ -n "$NODE_IP" ]; then
              REGISTRY_HOST="${NODE_IP}:30500"
              echo "Uso NodePort registry $REGISTRY_HOST per image pull"
            fi
          fi
        fi
        export TAG
        export MY_OPERATOR_IMAGE=${REGISTRY_HOST}/$GITHUB_USER/openserverless-operator
        if [ -n "$GHCR_USER" ] && [ -n "$GHCR_TOKEN" ]; then
          export MY_OPERATOR_IMAGE_SPARK="ghcr.io/$GHCR_USER/openserverless-operator:spark-dev"
        else
          export MY_OPERATOR_IMAGE_SPARK="${REGISTRY_HOST}/$GITHUB_USER/openserverless-operator:$TAG"
        fi
        envsubst < deploy/nuvolaris-operator/operator-pod-spark.yaml > _operator-pod-spark.yaml
      - kubectl -n nuvolaris delete pod nuvolaris-operator-spark --ignore-not-found
      - kubectl -n nuvolaris apply -f _operator-pod-spark.yaml
      - kubectl -n nuvolaris wait --for=condition=Ready pod/nuvolaris-operator-spark --timeout=180s || true
      - kubectl -n nuvolaris get pod nuvolaris-operator-spark -o wide || true
      - |
        WHISK=whisk-spark task t:instance

  login-ghcr:
    desc: "login a GHCR (richiede GHCR_USER e GHCR_TOKEN in .env)"
    cmds:
      - test -n "$GHCR_USER" || (echo "GHCR_USER mancante" && exit 1)
      - test -n "$GHCR_TOKEN" || (echo "GHCR_TOKEN mancante" && exit 1)
      - echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin

  build-ghcr:
    desc: "build immagine operatore Spark (ghcr.io/$GHCR_USER/openserverless-operator:spark-dev)"
    cmds:
      - test -n "$GHCR_USER" || (echo "GHCR_USER mancante" && exit 1)
      - podman build -t ghcr.io/$GHCR_USER/openserverless-operator:spark-dev -f Dockerfile .

  push-ghcr:
    desc: "push immagine operatore Spark su GHCR"
    deps: [login-ghcr]
    cmds:
      - test -n "$GHCR_USER" || (echo "GHCR_USER mancante" && exit 1)
      - podman push ghcr.io/$GHCR_USER/openserverless-operator:spark-dev

  deploy-ghcr:
    desc: "deploy pod operatore Spark usando manifest parametrizzato"
    env:
      GHCR_USER: ${GHCR_USER}
    cmds:
      - test -n "$GHCR_USER" || (echo "GHCR_USER mancante" && exit 1)
      - envsubst < deploy/nuvolaris-operator/operator-pod-spark.yaml > _operator-pod-spark.yaml
      - kubectl -n nuvolaris apply -f deploy/nuvolaris-permissions || true
      - kubectl -n nuvolaris apply -f _operator-pod-spark.yaml
      - kubectl -n nuvolaris wait --for=condition=Ready pod/nuvolaris-operator-spark --timeout=180s || true
      - kubectl -n nuvolaris get pod nuvolaris-operator-spark -o wide || true

  all-ghcr:
    desc: "build + push + deploy operatore Spark (GHCR)"
    cmds:
      - task: build-ghcr
      - task: push-ghcr
      - task: deploy-ghcr

  # ── CRD & Permissions ──────────────────────────────────────────────────────

  deploy-crd:
    desc: "applica SparkJob CRD e verifica registrazione"
    cmds:
      - kubectl apply -f deploy/nuvolaris-permissions/sparkjob-crd.yaml
      - kubectl get crd sparkjobs.nuvolaris.org || true

  # ── OWS Workflow ───────────────────────────────────────────────────────────

  deploy-workflow:
    desc: "applica RBAC OWS-Spark, crea trigger spark-job-status, deploy action spark-launch/event-handler, crea rule"
    cmds:
      - echo "=== [1/5] RBAC OWS-Spark ==="
      - kubectl apply -f deploy/nuvolaris-permissions/ows-spark-roles.yaml
      - kubectl auth can-i create sparkjobs.nuvolaris.org --as=system:serviceaccount:nuvolaris:default -n nuvolaris
      - echo "=== [2/5] Trigger spark-job-status ==="
      - |
        if ops -wsk -i trigger get spark-job-status &>/dev/null; then
          echo "  trigger già presente"
        else
          ops -wsk -i trigger create spark-job-status
        fi
      - echo "=== [3/5] Action spark-launch ==="
      - |
        if ops -wsk -i action get spark-launch &>/dev/null; then
          ops -wsk -i action update spark-launch tests/spark/spark_launch.py --kind python:3
        else
          ops -wsk -i action create spark-launch tests/spark/spark_launch.py --kind python:3
        fi
      - echo "=== [4/5] Action spark-event-handler ==="
      - |
        if ops -wsk -i action get spark-event-handler &>/dev/null; then
          ops -wsk -i action update spark-event-handler tests/spark/spark_event_handler.py --kind python:3
        else
          ops -wsk -i action create spark-event-handler tests/spark/spark_event_handler.py --kind python:3
        fi
      - echo "=== [5/5] Rule spark-job-rule ==="
      - |
        if ops -wsk -i rule get spark-job-rule &>/dev/null; then
          ops -wsk -i rule update spark-job-rule spark-job-status spark-event-handler
        else
          ops -wsk -i rule create spark-job-rule spark-job-status spark-event-handler
        fi
      - echo "=== Workflow OWS completato ==="
      - ops -wsk -i trigger list
      - ops -wsk -i action list
      - ops -wsk -i rule list

  test-workflow-e2e:
    desc: "e2e: lancia spark-launch via OWS, attende driver Succeeded, verifica trigger spark-job-status"
    cmds:
      - task: deploy-workflow
      - |
        echo "=== [0] Pre-cleanup: rimuovo wf-pi-* residui e attendo rilascio risorse worker ==="
        kubectl -n nuvolaris get sparkjob --no-headers 2>/dev/null \
          | awk '/^wf-pi-/{print $1}' \
          | xargs -r kubectl -n nuvolaris delete sparkjob --ignore-not-found 2>/dev/null || true
        kubectl -n nuvolaris get job --no-headers 2>/dev/null \
          | awk '/^wf-pi-/{print $1}' \
          | xargs -r kubectl -n nuvolaris delete job --ignore-not-found 2>/dev/null || true
        echo "  Attendo 20s per il rilascio dei JVM executor sui worker..."
        sleep 20
      - |
        JOB_NAME="wf-pi-$(date +%s)"
        echo "=== [1] Lancio job OWS: $JOB_NAME ==="
        LAUNCH_OUT=$(ops -wsk -i action invoke spark-launch --result \
          -p job_name "$JOB_NAME" \
          -p main_class "org.apache.spark.examples.SparkPi" \
          -p main_application_file "local:///opt/spark/examples/jars/spark-examples_2.12-3.5.0.jar" \
          -p arguments '["10"]' \
          -p instances 2)
        echo "$LAUNCH_OUT"
        JOB_ID=$(echo "$LAUNCH_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('job_id',''))")
        if [ -z "$JOB_ID" ]; then
          echo "ERRORE: job_id vuoto nella risposta OWS" >&2; exit 1
        fi
        echo "  job_id: $JOB_ID"

        echo "=== [2] Attendo creazione SparkJob CRD (max 15s) ==="
        for i in $(seq 1 15); do
          if kubectl get sparkjob "$JOB_ID" -n nuvolaris &>/dev/null; then
            echo "  SparkJob $JOB_ID creato"
            kubectl get sparkjob "$JOB_ID" -n nuvolaris
            break
          fi
          sleep 1
        done

        echo "=== [3] Attendo completamento driver pod (max 180s) ==="
        DRIVER_POD=""
        PHASE=""
        for i in $(seq 1 90); do
          POD_INFO=$(kubectl get pod -n nuvolaris -l "nuvolaris.org/spark-job-id=$JOB_ID" \
            --no-headers -o custom-columns='NAME:.metadata.name,PHASE:.status.phase' 2>/dev/null | head -1)
          if [ -n "$POD_INFO" ]; then
            DRIVER_POD=$(echo "$POD_INFO" | awk '{print $1}')
            PHASE=$(echo "$POD_INFO" | awk '{print $2}')
            echo "  pod: $POD_INFO"
            if [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ]; then
              break
            fi
          fi
          sleep 2
        done

        echo "=== [4] Verifica calcolo SparkPi nei log driver ==="
        sleep 3
        if [ -n "$DRIVER_POD" ]; then
          DRIVER_LOGS=$(kubectl logs -n nuvolaris "$DRIVER_POD" 2>/dev/null || true)
        else
          DRIVER_LOGS=$(kubectl logs -n nuvolaris -l "nuvolaris.org/spark-job-id=$JOB_ID" 2>/dev/null || true)
        fi
        echo "$DRIVER_LOGS" | tail -20
        if echo "$DRIVER_LOGS" | grep -q "Pi is roughly"; then
          PI_RESULT=$(echo "$DRIVER_LOGS" | grep "Pi is roughly")
          if [ "$PHASE" = "Failed" ]; then
            echo "WARNING: job completed ($PI_RESULT) but pod exited non-zero — known Spark 3.5 standalone JVM shutdown race condition"
          else
            echo "OK: $PI_RESULT"
          fi
        else
          echo "ERRORE: 'Pi is roughly' non trovato nei log del driver — il job Spark è davvero fallito" >&2
          kubectl -n nuvolaris delete sparkjob "$JOB_ID" --ignore-not-found 2>/dev/null || true
          kubectl -n nuvolaris delete job "${JOB_ID}-driver" --ignore-not-found 2>/dev/null || true
          exit 1
        fi

        echo "=== [5] Verifica trigger spark-job-status (max 90s) ==="
        PREV_ACT=$(ops -wsk -i activation list --limit 5 2>/dev/null \
          | grep "spark-event-handler" | head -1 | grep -oE '[0-9a-f]{32}' || true)
        for i in $(seq 1 18); do
          LAST=$(ops -wsk -i activation list --limit 5 2>/dev/null \
            | grep "spark-event-handler" | head -1 | grep -oE '[0-9a-f]{32}' || true)
          if [ -n "$LAST" ] && [ "$LAST" != "${PREV_ACT:-}" ]; then
            echo "  Trigger ricevuto e rule eseguita! (activation: $LAST)"
            GOT_RESULT=0
            for attempt in 1 2 3; do
              RESULT=$(ops -wsk -i activation get "$LAST" 2>/dev/null | tail -n +2 || true)
              if echo "$RESULT" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
                echo "$RESULT" | python3 -c \
                  "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('response',{}).get('result',{}), indent=2))"
                GOT_RESULT=1
                break
              fi
              sleep 2
            done
            [ "$GOT_RESULT" = "0" ] && echo "  (impossibile leggere il risultato)"
            kubectl -n nuvolaris delete sparkjob "$JOB_ID" --ignore-not-found 2>/dev/null || true
            kubectl -n nuvolaris delete job "${JOB_ID}-driver" --ignore-not-found 2>/dev/null || true
            echo "SUCCESS: workflow OWS Spark verificato end-to-end"
            exit 0
          fi
          echo "  (attesa... $((i*5))s)"
          sleep 5
        done
        kubectl -n nuvolaris delete sparkjob "$JOB_ID" --ignore-not-found 2>/dev/null || true
        kubectl -n nuvolaris delete job "${JOB_ID}-driver" --ignore-not-found 2>/dev/null || true
        echo "WARNING: trigger spark-job-status non rilevato nelle activation (watcher potrebbe avere delay)"

  # ── Tests ──────────────────────────────────────────────────────────────────

  test-pi-submit:
    desc: "SparkPi via spark-submit classico — verifica salute del cluster"
    cmds:
      - kubectl delete job spark-pi-submit-test -n nuvolaris --ignore-not-found
      - kubectl apply -f tests/spark/test-sparkpi-submit.yaml
      - kubectl -n nuvolaris wait --for=condition=complete job/spark-pi-submit-test --timeout=120s
      - echo "=== Risultato ==="
      - kubectl -n nuvolaris logs -l job-name=spark-pi-submit-test | grep "Pi is roughly"

  test-pi-crd:
    desc: "SparkPi via SparkJob CRD (monitoring off) — verifica operator base"
    cmds:
      - kubectl delete sparkjob pi-crd-test -n nuvolaris --ignore-not-found
      - kubectl delete job pi-crd-test-driver -n nuvolaris --ignore-not-found
      - sleep 3
      - kubectl apply -f tests/spark/test-sparkpi-crd.yaml
      - |
        echo "Attendo creazione driver job da parte dell'operator..."
        for i in $(seq 1 30); do
          kubectl -n nuvolaris get job pi-crd-test-driver 2>/dev/null && break
          sleep 2
        done
      - kubectl -n nuvolaris wait --for=condition=complete job/pi-crd-test-driver --timeout=120s
      - echo "=== Risultato ==="
      - |
        POD=$(kubectl -n nuvolaris get pod -l job-name=pi-crd-test-driver -o jsonpath='{.items[0].metadata.name}')
        kubectl -n nuvolaris logs $POD | grep "Pi is roughly"

  test-pi-crd-reconcile:
    desc: "SparkPi via SparkJob CRD con eventLog+historyServer — valida watcher/reconciler/History"
    cmds:
      - kubectl delete sparkjob pi-reconcile-test -n nuvolaris --ignore-not-found
      - kubectl delete job pi-reconcile-test-driver -n nuvolaris --ignore-not-found
      - sleep 3
      - kubectl apply -f tests/spark/test-sparkpi-crd-reconcile.yaml
      - |
        echo "Attendo creazione driver job da parte dell'operator..."
        for i in $(seq 1 30); do
          kubectl -n nuvolaris get job pi-reconcile-test-driver 2>/dev/null && break
          sleep 2
        done
      - kubectl -n nuvolaris wait --for=condition=complete job/pi-reconcile-test-driver --timeout=300s
      - echo "=== Risultato Pi ==="
      - |
        POD=$(kubectl -n nuvolaris get pod -l job-name=pi-reconcile-test-driver -o jsonpath='{.items[0].metadata.name}')
        kubectl -n nuvolaris logs $POD | grep "Pi is roughly"
      - echo "=== Event log su PVC ==="
      - |
        HIST=$(kubectl -n nuvolaris get pod -l component=spark-history -o jsonpath='{.items[0].metadata.name}')
        kubectl -n nuvolaris exec $HIST -- ls -lh /tmp/spark-events

  pipeline-test:
    desc: "test end-to-end: CRD reconcile → verifica History → trigger → reconciler → workflow OWS → report"
    cmds:
      - task: verify-whisk-secrets
      - task: clean
      - task: test-pi-crd-reconcile
      - echo "=== History Server — event log ==="
      - |
        HIST=$(kubectl -n nuvolaris get pod -l component=spark-history -o jsonpath='{.items[0].metadata.name}')
        kubectl -n nuvolaris exec $HIST -- ls -lh /tmp/spark-events
      - echo "=== Trigger OWS — eventi watcher ==="
      - task: test-trigger
      - echo "=== Reconciler CronJob — ultima esecuzione ==="
      - kubectl -n nuvolaris get cronjob spark-reconciler -o jsonpath='{.status.lastScheduleTime}' && echo
      - kubectl -n nuvolaris get jobs -l app=spark-reconciler --sort-by=.metadata.creationTimestamp 2>/dev/null | tail -3 || true
      - echo "=== PVC spark-history-pvc ==="
      - kubectl -n nuvolaris get pvc spark-history-pvc
      - echo "=== Workflow OWS end-to-end ==="
      - task: test-workflow-e2e
      - echo "=== Report finale — pod Spark ==="
      - kubectl -n nuvolaris get pod -l app=spark -o wide

  # ── Observability ──────────────────────────────────────────────────────────

  status:
    desc: "stato di tutti i componenti Spark (cluster, jobs, PVC, watcher, reconciler)"
    cmds:
      - echo "=== Spark Cluster Pods ==="
      - kubectl -n nuvolaris get pods -l app=spark | grep -E "(master|worker|history)" || echo "Spark cluster non attivo"
      - echo "=== SparkJobs ==="
      - kubectl -n nuvolaris get sparkjobs -o wide || echo "Nessun SparkJob"
      - echo "=== Driver Jobs ==="
      - kubectl -n nuvolaris get jobs -l app=spark,component=driver || echo "Nessun driver job"
      - echo "=== PVC ==="
      - kubectl -n nuvolaris get pvc spark-history-pvc || echo "PVC non trovato"
      - echo "=== Watcher + Reconciler ==="
      - kubectl -n nuvolaris get deployment spark-watcher cronjob/spark-reconciler || true

  verify-whisk-secrets:
    desc: "verifica che il token whisk-system nel CRD non sia il placeholder di sviluppo"
    cmds:
      - |
        TOKEN=$(kubectl -n nuvolaris get wsk/controller \
          -o jsonpath='{.spec.openwhisk.namespaces.whisk-system}' 2>/dev/null)
        if [ -z "$TOKEN" ]; then
          echo "ERRORE: impossibile leggere spec.openwhisk.namespaces.whisk-system dal CRD wsk/controller"
          exit 1
        fi
        UUID="${TOKEN%%:*}"
        PLACEHOLDER="789c46b1-71f6-4ed5-8c54-816aa4f8c502"
        if [ "$UUID" = "$PLACEHOLDER" ]; then
          echo ""
          echo "WARNING: whisk-system usa il token placeholder di sviluppo!"
          echo "  UUID letto : $UUID"
          echo "  Le system action whisk-system potrebbero non essere deployate correttamente."
          echo "  Verifica lo stato effettivo con:"
          echo "  kubectl -n nuvolaris get wsk controller -o jsonpath='{.status.whisk_create.whisk-system}'"
          echo ""
        else
          echo "OK: token whisk-system sembra valido (UUID: $UUID)"
        fi

  logs-operator:
    desc: "tail log operator filtrati su spark/watcher/reconciler/secret"
    cmds:
      - kubectl -n nuvolaris logs pod/nuvolaris-operator -f | grep -iE "spark|watcher|reconciler|secret|ERROR|WARNING"

  test-trigger:
    desc: "verifica se spark-watcher ha inviato eventi al trigger OWS spark-job-status"
    cmds:
      - echo "=== Log spark-watcher (fonte primaria) ==="
      - kubectl -n nuvolaris logs deployment/spark-watcher --tail=50 | grep -iE "trigger|spark-job-status|OWS|POST|sent|error|notified|phase_updated|ows_delivered" || echo "Nessun evento trigger nei log watcher"
      - echo "=== Attivazioni OWS via CouchDB (opzionale) ==="
      - |
        COUCH_USER=$(kubectl -n nuvolaris get secret couchdb-auth -o jsonpath='{.data.adminUsername}' 2>/dev/null | base64 -d 2>/dev/null || echo "")
        COUCH_PASS=$(kubectl -n nuvolaris get secret couchdb-auth -o jsonpath='{.data.adminPassword}' 2>/dev/null | base64 -d 2>/dev/null || echo "")
        if [ -n "$COUCH_USER" ]; then
          kubectl -n nuvolaris exec deployment/couchdb -- \
            curl -s -u "${COUCH_USER}:${COUCH_PASS}" \
            "http://localhost:5984/nuvolaris_activations/_all_docs?limit=5&descending=true" \
            2>/dev/null | python3 -m json.tool 2>/dev/null | grep -i "spark\|trigger" || echo "Nessuna attivazione spark trovata"
        else
          echo "Secret couchdb-auth non disponibile, skip verifica CouchDB"
        fi

  # ── Cleanup ────────────────────────────────────────────────────────────────

  clean:
    desc: "rimuove tutte le risorse di test SparkJob (CRD, driver job, workflow wf-pi-*)"
    cmds:
      - kubectl -n nuvolaris delete sparkjob pi-crd-test --ignore-not-found
      - kubectl -n nuvolaris delete sparkjob pi-reconcile-test --ignore-not-found
      - kubectl -n nuvolaris delete job pi-crd-test-driver --ignore-not-found
      - kubectl -n nuvolaris delete job pi-reconcile-test-driver --ignore-not-found
      - kubectl -n nuvolaris delete job spark-pi-submit-test --ignore-not-found
      - |
        kubectl -n nuvolaris get sparkjob --no-headers 2>/dev/null \
          | awk '/^wf-pi-/{print $1}' \
          | xargs -r kubectl -n nuvolaris delete sparkjob --ignore-not-found || true
        kubectl -n nuvolaris get job --no-headers 2>/dev/null \
          | awk '/^wf-pi-.*-driver/{print $1}' \
          | xargs -r kubectl -n nuvolaris delete job --ignore-not-found || true
      - echo "Risorse test Spark rimosse"
