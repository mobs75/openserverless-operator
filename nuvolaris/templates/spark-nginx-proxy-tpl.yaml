apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-nginx-conf
  namespace: {{namespace}}
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      server {
        listen 8080;
        location / {
          proxy_pass http://spark-master:8080;
          proxy_set_header Accept-Encoding "";
          sub_filter_once off;
          {% for i in range(worker_replicas) %}
          sub_filter 'href="http://spark-worker-{{i}}:{{worker_webui_port}}"' 'href="/worker-{{i}}/"';
          sub_filter 'href="http://spark-worker-{{i}}:{{worker_webui_port}}/' 'href="/worker-{{i}}/';
          {% endfor %}
        }
        {% for i in range(worker_replicas) %}
        location /worker-{{i}}/ {
          resolver kube-dns.kube-system.svc.cluster.local valid=30s;
          set $backend_{{i}} "spark-worker-{{i}}.spark-worker.{{namespace}}.svc.cluster.local:8081";
          rewrite ^/worker-{{i}}/(.*) /$1 break;
          proxy_pass http://$backend_{{i}};
          proxy_set_header Accept-Encoding "";
          sub_filter_once off;
          sub_filter 'href="http://spark-worker-{{i}}:{{worker_webui_port}}"' 'href="/worker-{{i}}/"';
          sub_filter 'href="http://spark-worker-{{i}}:{{worker_webui_port}}/' 'href="/worker-{{i}}/';
          sub_filter 'href="http://0.0.0.0:8080/"' 'href="/"';
          sub_filter 'href="http://0.0.0.0:8080"' 'href="/"';
        }
        {% endfor %}
        location /history/static/ {
          resolver kube-dns.kube-system.svc.cluster.local valid=30s;
          set $history "spark-history.{{namespace}}.svc.cluster.local:18080";
          rewrite ^/history/static/(.*) /static/$1 break;
          proxy_pass http://$history;
          proxy_set_header Accept-Encoding "";
        }
        location /history/api/ {
          resolver kube-dns.kube-system.svc.cluster.local valid=30s;
          set $history "spark-history.{{namespace}}.svc.cluster.local:18080";
          rewrite ^/history/api/(.*) /api/$1 break;
          proxy_pass http://$history;
          proxy_set_header Accept-Encoding "";
        }
        location ~ ^/history/history/(.*)$ {
          return 302 $scheme://$http_host/history/$1$is_args$args;
        }
        location = /history/ {
          resolver kube-dns.kube-system.svc.cluster.local valid=30s;
          set $history "spark-history.{{namespace}}.svc.cluster.local:18080";
          rewrite .* / break;
          proxy_pass http://$history;
          proxy_set_header Accept-Encoding "";
          sub_filter_once off;
          sub_filter 'href="/static/' 'href="/history/static/';
          sub_filter 'src="/static/' 'src="/history/static/';
          sub_filter "setUIRoot('')" "setUIRoot('/history')";
          sub_filter 'href="/"' 'href="/history/"';
          sub_filter 'href="/?' 'href="/history/?';
          sub_filter 'spark.local:8080' 'spark.local:32080';
        }
        location /history/ {
          resolver kube-dns.kube-system.svc.cluster.local valid=30s;
          set $history "spark-history.{{namespace}}.svc.cluster.local:18080";
          proxy_pass http://$history;
          proxy_set_header Accept-Encoding "";
          proxy_redirect http://spark-history.{{namespace}}.svc.cluster.local:18080 $scheme://$http_host;
          sub_filter_once off;
          sub_filter 'href="/static/' 'href="/history/static/';
          sub_filter 'src="/static/' 'src="/history/static/';
          sub_filter 'href="/"' 'href="/history/"';
          sub_filter 'spark.local:8080' 'spark.local:32080';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-nginx-proxy
  namespace: {{namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-nginx-proxy
  template:
    metadata:
      labels:
        app: spark-nginx-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: spark-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: spark-nginx-proxy
  namespace: {{namespace}}
spec:
  type: NodePort
  selector:
    app: spark-nginx-proxy
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 32080
